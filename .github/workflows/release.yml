name: Auto Release JARs

on:
  push:
    tags:
      - 'v*' # Workflow sẽ tự động chạy khi bạn push 1 tag có chữ 'v' đứng đầu (vd: v1.0.0)

permissions:
  contents: write # Cấp quyền cho GitHub Actions được phép tạo bài Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build JARs with Maven
        run: mvn -B clean package -DskipTests
        # Lệnh này sẽ build ra file .jar chính, file -sources.jar và file -javadoc.jar

      - name: Create GitHub Release & Upload JARs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Tự động tạo Release Notes dựa trên commit
          files: |
            target/zalo-bot-java-sdk-*.jar
